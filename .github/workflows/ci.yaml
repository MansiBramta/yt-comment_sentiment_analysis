name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]" pytest httpx fastapi uvicorn requests python-dotenv nltk joblib

      - name: Pull data and models from S3 (DVC)
        run: dvc pull

      - name: Check the pipeline is reproducible
        run: dvc repro

      - name: Run tests
        run: pytest tests -v