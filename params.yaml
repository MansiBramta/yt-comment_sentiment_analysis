data_ingestion:
   test_size: 0.2
   random_state: 42

feature_engineering:
  max_features: 5000
  ngram_range: [1, 3]

model_building:
  cv_folds: 5
  random_state: 42
  lightgbm:
    n_estimators: 200
    learning_rate: 0.1
    num_leaves: 31
  linear_svc_C: 1.0
  logistic_regression_C: 1.0
  complement_nb_alpha: 0.5
