stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
    params:
      - data_ingestion.test_size
      - data_ingestion.random_state
    outs:
      - data/raw/train.csv
      - data/raw/test.csv

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/raw/train.csv
      - data/raw/test.csv
    outs:
      - data/interim/train_processed.csv
      - data/interim/test_processed.csv

  feature_engineering:
    cmd: python src/features/feature_engineering.py
    deps:
      - src/features/feature_engineering.py
      - data/interim/train_processed.csv
      - data/interim/test_processed.csv
    params:
      - feature_engineering.max_features
      - feature_engineering.ngram_range
    outs:
      - data/processed/X_train.npz
      - data/processed/X_test.npz
      - data/processed/y_train.npy
      - data/processed/y_test.npy
      - models/tfidf_vectorizer.pkl

  model_building:
    cmd: python src/model/model_building.py
    deps:
      - src/model/model_building.py
      - data/processed/X_train.npz
      - data/processed/y_train.npy
    params:
      - model_building
    outs:
      - models/stacking_model.pkl

  model_evaluation:
    cmd: python src/model/model_evaluation.py
    deps:
      - src/model/model_evaluation.py
      - models/stacking_model.pkl
      - data/processed/X_test.npz
      - data/processed/y_test.npy
    metrics:
      - metrics.json:
          cache: false
    outs:
      - reports/experiment_info.json:
          cache: false

  model_registration:
    cmd: python src/model/model_registration.py
    deps:
      - src/model/model_registration.py
      - reports/experiment_info.json